<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Weather / Now — a premium, minimal weather utility. Search any city, see its current weather.">
  <title>Weather / Now</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <video
    class="background-video"
    autoplay
    muted
    loop
    playsinline
    aria-hidden="true"
  >
    <source src="/static/video/spiderman.mp4" type="video/mp4">
  </video>

  <div class="background-overlay"></div>

  <div class="app">
    <header class="topbar">
      <div class="brand">WEATHER <span>/</span> NOW</div>
      <div class="date" id="date" aria-hidden="true"></div>
    </header>

    <main>
      <form id="searchForm" class="search-block" autocomplete="off">
        <label class="search-label" for="cityInput">SEARCH CITY</label>
        <div class="search-row">
          <input
            type="text"
            id="cityInput"
            name="city"
            placeholder="SEARCH ANY CITY..."
            spellcheck="false"
            aria-describedby="status">
          <button type="submit" id="checkBtn">CHECK&nbsp;→</button>
        </div>
        <p class="status" id="status" role="status"></p>
      </form>

      <section id="result" class="result" aria-live="polite" aria-atomic="true">
        <h1 class="location"><span id="cityName"></span><span class="day-dot" id="dayDot" aria-hidden="true"></span></h1>
        <p class="day-night" id="dayNight"></p>

        <div class="temp-row">
          <p class="temp"><span id="temp"></span><span class="unit">°</span></p>
          <p class="condition" id="condition"></p>
        </div>

        <div class="stats">
          <div class="stat">
            <span class="k">HUMIDITY</span>
            <span class="v"><span id="humidity"></span>%</span>
          </div>
          <div class="stat">
            <span class="k">FEELS LIKE</span>
            <span class="v"><span id="feelsLike"></span>°</span>
          </div>
          <div class="stat">
            <span class="k">WIND</span>
            <span class="v"><span id="wind"></span> <small>KM/H</small></span>
          </div>
        </div>

        <div class="meta">
          <span id="timezone"></span>
          <span id="coords"></span>
        </div>
      </section>

      <section id="errorBlock" class="error-block" aria-live="assertive" hidden>
        <h2 id="errorTitle"></h2>
        <p id="errorText"></p>
      </section>
    </main>

    <footer>
      DATA BY <a href="https://open-meteo.com" target="_blank" rel="noopener">OPEN-METEO</a> · NO API KEY
    </footer>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
